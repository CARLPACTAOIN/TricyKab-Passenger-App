name: passenger_app
description: "TricyKab Passenger App — Smart Tricycle Dispatch System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.4.0
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#6258CA"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter_native_splash:
  color: "#F6F6F8"
  image: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F6F6F8"
    image: assets/branding/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
